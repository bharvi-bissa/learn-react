<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Roulette - Movie Finder</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* General Body Styling */
        body {
            background-color: #2c2c2c;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* Header Section */
        .header {
            background: #1c1c1c;
            height: 300px;
            /* Increased height */
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-weight: bold;
            font-size: 24px;
            color: #e50914;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .add-movie-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #e50914;
            border: none;
            color: #fff;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Search Section */
        .search-bar {
            margin: auto;
            /* centers vertically & horizontally inside header */
            width: 100%;
            max-width: 600px;
        }

        .search-bar h2 {
            color: #fff;
            font-size: 32px;
            letter-spacing: 1px;
        }

        .search-bar input {
            border-radius: 0;
        }

        .search-bar button {
            background-color: #e50914;
            border-radius: 0;
            border: none;
            color: #fff;
        }

        /* Filters and Sorting */
        .filter-bar {
            background: #1c1c1c;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .filter-bar .filters span {
            margin-right: 15px;
            cursor: pointer;
        }

        .filter-bar .filters span.active {
            border-bottom: 2px solid #e50914;
            padding-bottom: 2px;
        }

        .sort select {
            cursor: pointer;
        }

        /* Movie Cards */
        .movie-card {
            background: #1c1c1c;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }

        .movie-card:hover {
            transform: scale(1.05);
        }

        .movie-card img {
            width: 100%;
            height: auto;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-info h6 {
            margin: 0;
            font-size: 16px;
            font-weight: bold;
        }

        .movie-info p {
            margin: 0;
            font-size: 14px;
            color: #aaa;
        }

        .movie-year {
            float: right;
            border: 1px solid #aaa;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <!-- Header (Component: Header) -->
    <div class="header">
        <span class="logo">netflix<span style="color:white;">roulette</span></span>
        <button class="add-movie-btn">+ ADD MOVIE</button>

        <!-- Search Section -->
        <div class="container search-bar text-center">
            <h2 class="mb-4 fw-bold text-uppercase">Find Your Movie</h2>
            <div class="input-group">
                <input type="text" class="form-control" placeholder="What do you want to watch?">
                <button class="btn">SEARCH</button>
            </div>
        </div>
    </div>


    <!-- Filter Bar (Component: FilterBar) -->
    <div class="filter-bar">
        <div class="filters">
            <span class="active">ALL</span>
            <span>DOCUMENTARY</span>
            <span>COMEDY</span>
            <span>HORROR</span>
            <span>CRIME</span>
        </div>
        <div class="sort d-flex align-items-center">
            <span class="me-2">Sort by:</span>
            <select class="form-select form-select-sm bg-dark text-white border-0" style="width:auto;">
                <option selected>Release Date</option>
                <option>2024</option>
                <option>2023</option>
                <option>2022</option>
                <option>2021</option>
                <option>2020</option>
            </select>
        </div>
    </div>

    <!-- Movies Section (Component: MovieList + MovieCard) -->
    <div class="container my-4">
        <div class="row">

            <!-- Movie Card -->
            <div class="col-md-4">
                <div class="movie-card">
                    <img src="https://picsum.photos/300/450?random=1" alt="Movie Poster">
                    <div class="movie-info">
                        <h6>Pulp Fiction <span class="movie-year">1994</span></h6>
                        <p>Action & Adventure</p>
                    </div>
                </div>
            </div>

            <!-- Movie Card -->
            <div class="col-md-4">
                <div class="movie-card">
                    <img src="https://picsum.photos/300/450?random=2" alt="Movie Poster">
                    <div class="movie-info">
                        <h6>Bohemian Rhapsody <span class="movie-year">2018</span></h6>
                        <p>Drama, Biography, Music</p>
                    </div>
                </div>
            </div>

            <!-- Movie Card -->
            <div class="col-md-4">
                <div class="movie-card">
                    <img src="https://picsum.photos/300/450?random=3" alt="Movie Poster">
                    <div class="movie-info">
                        <h6>Kill Bill Vol. 2 <span class="movie-year">2004</span></h6>
                        <p>Oscar winning Movie</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer (Component: Footer) -->
    <div class="text-center py-3" style="background:#1c1c1c; color:#888;">
        netflix<span style="color:#e50914;">roulette</span>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
